<!doctype html>
<!--

DISCLAIMER: Use of large language models (artificial intelligence): All of
these apps were generated using the large language model Claude Sonnet 5.5
(Anthropic). Visually, the apps look tidy and demonstrate the effects that will
be shown during the lecture. However, they have not been checked in detail, so
they may be unsuitable for anything beyond visualization.

-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miesto dydžio modeliavimas (Simon'o modelis)</title>
<style>
:root {
--bg: #fbfaf7;
    --fg: #1f1d1a;
    --muted: #6b665e;
    --panel: #ffffff;
    --line: #d9d4c8;
    --accent: #c8472f;
    --accent2: #2f7f8f;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #17161a;
        --fg: #ece8df;
        --muted: #a09a8e;
        --panel: #201f24;
        --line: #3a383f;
        --accent: #ff7a5c;
        --accent2: #5cc0d1;
   }
}
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, sans-serif;
}
.wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 16px 40px;
}
h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
}
.sub {
    color: var(--muted);
    margin: 0 0 16px;
}
.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
}
.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 24px;
    align-items: center;
    margin-bottom: 14px;
}
.controls .group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}
label {
    font-size: 0.9rem;
}
.val {
    font-variant-numeric: tabular-nums;
    min-width: 4.5em;
    display: inline-block;
    color: var(--accent);
    font-weight: 600;
}
button {
    font: inherit;
    font-size: 0.9rem;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--fg);
}
button:hover {
    border-color: var(--accent2);
}
button.primary {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #fff;
    min-width: 5.5em;
}
input[type=range] {
    width: 160px;
    accent-color: var(--accent2);
}
.event {
    min-height: 3em;
    margin: 0 0 14px;
    padding: 10px 14px;
    border-left: 4px solid var(--accent);
    background: var(--panel);
    border-radius: 0 8px 8px 0;
    font-size: 0.95rem;
}
canvas {
    width: 100%;
    height: 600px;
    display: block;
}
@media (max-width: 700px) {
    canvas {
        height: 440px;
   }
}
.hover {
    min-height: 1.6em;
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 6px;
}
.legend {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
}
.legend i {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
    border: 2px solid;
    background: transparent;
}
.stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 28px;
    margin: 14px 0;
    font-size: 0.9rem;
}
.stats b {
    font-variant-numeric: tabular-nums;
}
.stats span {
    color: var(--muted);
}

</style>
</head>
<body>
<div class="wrap">
  <h1>Miesto dydžio modeliavimas (Simon'o modelis)</h1>
  <p class="sub">Kiekvienas naujas gyventojas arba (1) įkūria naują miestą, arba (2) pasirenka seną gyventoją ir apsigyvena tame pačiame mieste.</p>
  <div class="panel controls">
    <div class="group">
      <label for="p">Naujo miesto įkūrimo tikimybė &alpha;</label>
      <input id="p" type="range" min="0.01" max="0.4" step="0.01" value="0.1">
      <span class="val" id="pVal"></span>
    </div>
    <div class="group">
      <label for="speed">Greitis</label>
      <input id="speed" type="range" min="0" max="3" step="0.05" value="0">
      <span class="val" id="speedVal"></span>
    </div>
    <div class="group">
      <button id="play" class="primary">Paleisti</button>
      <button id="step">+1</button>
      <button id="step10">+10</button>
      <button id="step100">+100</button>
      <button id="reset">Iš naujo</button>
    </div>
  </div>

  <div class="event" id="event"></div>

  <div class="panel">
    <canvas id="view" role="img"></canvas>
    <div class="hover" id="hover">Užveskite pelę ant miesto, kad pamatytumėte kuris tai miestas.</div>
    <div class="legend">
      <i style="border-color:var(--accent)"></i>naujas gyventojas &nbsp;
      <i style="border-color:var(--fg)"></i>jo pasirinktas senas gyventojas &nbsp;
    </div>
  </div>

  <div class="stats panel" id="stats"></div>

</div>

<script>
(function () {
  "use strict";

  var MAX_N = 3000;                      // population cap
  var PR = 1;                            // person radius (world units)
  var SP = 1.3;                          // spiral spacing
  var PAD = 1.2;                         // gap kept between cities
  var GA = Math.PI * (3 - Math.sqrt(5)); // golden angle
  const MAX_NOT_RUNNING = 1000;

  /* ---------- sunflower layout inside a city (shared by all cities) ---------- */
  var LX = new Float32Array(MAX_N), LY = new Float32Array(MAX_N), LD = new Float32Array(MAX_N);
  (function () {
    var x0 = SP * Math.sqrt(0.5);        // shift so that person 0 sits at the city centre
    for (var i = 0; i < MAX_N; i++) {
      var rr = SP * Math.sqrt(i + 0.5);
      LX[i] = rr * Math.cos(i * GA) - x0;
      LY[i] = rr * Math.sin(i * GA);
      LD[i] = Math.sqrt(LX[i] * LX[i] + LY[i] * LY[i]);
    }
  })();

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("view");
  var pSlider = $("p"), speedSlider = $("speed");

  var cities, resCity, resIdx, n, maxSize, lastEvent, view;
  var running = false, not_running = 0, lastT = 0, acc = 0;
  var hoverCity = -1;

  function getP() { return parseFloat(pSlider.value); }
  function getSpeed() { return Math.round(Math.pow(10, parseFloat(speedSlider.value))); }

  /* ---------- model ---------- */

  function makeCity(id, x, y) {
    var th = Math.random() * 2 * Math.PI;
    return { id: id, x: x, y: y, count: 0, R: PR, Rd: PR, cr: Math.cos(th), sr: Math.sin(th) };
  }

  function reset() {
    cities = [];
    resCity = new Int32Array(MAX_N);
    resIdx = new Int32Array(MAX_N);
    var c = makeCity(0, 0, 0);
    c.count = 1;
    cities.push(c);
    resCity[0] = 0; resIdx[0] = 0;
    n = 1; maxSize = 1;
    lastEvent = { type: "start", t: 0 };
    view = { scale: 12, ex: 1, ey: 1 };
    acc = 0; hoverCity = -1;
  }

  function step(p) {
    if (n >= MAX_N) return false;
    var now = performance.now();
    if (Math.random() < p) {
      var th = Math.random() * 2 * Math.PI;
      var c = makeCity(cities.length, (view.ex + 5) * Math.cos(th), (view.ey + 5) * Math.sin(th));
      c.count = 1;
      cities.push(c);
      resCity[n] = c.id; resIdx[n] = 0;
      n++;
      lastEvent = { type: "new", city: c.id, idx: 0, person: n, t: now };
    } else {
      var who = Math.floor(Math.random() * n);        // uniformly random existing resident
      var cid = resCity[who];
      var city = cities[cid];
      var idx = city.count++;
      var need = LD[idx] + PR;
      if (need > city.R) city.R = need;
      resCity[n] = cid; resIdx[n] = idx;
      n++;
      if (city.count > maxSize) maxSize = city.count;
      lastEvent = { type: "join", city: cid, idx: idx, pickedIdx: resIdx[who], picked: who + 1,
                    size: city.count, person: n, t: now };
    }
    return true;
  }

  function advance(k) {
    var p = getP();
    for (var i = 0; i < k; i++) {
      if (!step(p)) { setRunning(false); break; }
    }
    not_running = 0;
  }

  /* ---------- layout physics: keep cities from overlapping ---------- */

  function physics() {
    var N = cities.length, i, j, a, b;
    for (i = 0; i < N; i++) { a = cities[i]; a.Rd += (a.R - a.Rd) * 0.25; }

    for (var it = 0; it < 2; it++) {
      for (i = 0; i < N; i++) {
        a = cities[i];
        for (j = i + 1; j < N; j++) {
          b = cities[j];
          var dx = b.x - a.x, dy = b.y - a.y, md = a.Rd + b.Rd + PAD;
          if (dx > md || dx < -md || dy > md || dy < -md) continue;
          var d2 = dx * dx + dy * dy;
          if (d2 >= md * md) continue;
          var d = Math.sqrt(d2);
          if (d < 1e-6) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = Math.sqrt(dx * dx + dy * dy) || 1e-3; }
          var ov = (md - d) * 0.6, ux = dx / d, uy = dy / d;
          var ma = a.Rd * a.Rd, mb = b.Rd * b.Rd, fa = mb / (ma + mb);   // big cities move less
          a.x -= ux * ov * fa;       a.y -= uy * ov * fa;
          b.x += ux * ov * (1 - fa); b.y += uy * ov * (1 - fa);
        }
      }
    }

    var ex = 1, ey = 1;
    for (i = 0; i < N; i++) {
      a = cities[i];
      a.x -= a.x * 0.003;            // gentle pull towards the middle (weaker horizontally,
      a.y -= a.y * 0.007;            // so the group fills a wide canvas)
      var tx = Math.abs(a.x) + a.Rd, ty = Math.abs(a.y) + a.Rd;
      if (tx > ex) ex = tx;
      if (ty > ey) ey = ty;
    }
    view.ex = ex; view.ey = ey;
  }

  /* ---------- drawing ---------- */

  function setupCanvas(c) {
    var dpr = window.devicePixelRatio || 1;
    var w = c.clientWidth, h = c.clientHeight;
    var W = Math.round(w * dpr), H = Math.round(h * dpr);
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    var g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    return { g: g, w: w, h: h };
  }

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function personPos(city, i) {
    return { x: city.x + LX[i] * city.cr - LY[i] * city.sr,
             y: city.y + LX[i] * city.sr + LY[i] * city.cr };
  }

  var geom = { cx: 0, cy: 0, scale: 1 };

  function draw(now) {
    var s = setupCanvas(canvas), g = s.g, w = s.w, h = s.h;
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var fg = css("--fg"), bg = css("--bg"), accent = css("--accent");
    var light = dark ? 64 : 48;

    var target = Math.min((w / 2 - 12) / view.ex, (h / 2 - 12) / view.ey);
    view.scale += (target - view.scale) * 0.06;
    var scale = view.scale, cx = w / 2, cy = h / 2;
    geom.cx = cx; geom.cy = cy; geom.scale = scale;
    var rad = Math.max(1, PR * scale * 0.92);

    var N = cities.length, i, c, k;
    for (i = 0; i < N; i++) {
      c = cities[i];
      var hue = (c.id * 137.508) % 360;
      var sx = cx + c.x * scale, sy = cy + c.y * scale;

      // soft halo behind each city with at least two people
      if (c.count >= 2) {
        g.fillStyle = "hsla(" + hue + ",55%," + light + "%,0.12)";
        g.beginPath(); g.arc(sx, sy, c.Rd * scale, 0, 2 * Math.PI); g.fill();
      }
      if (i === hoverCity) {
        g.strokeStyle = fg; g.lineWidth = 1.5; g.setLineDash([4, 3]);
        g.beginPath(); g.arc(sx, sy, c.Rd * scale, 0, 2 * Math.PI); g.stroke();
        g.setLineDash([]);
      }

      g.fillStyle = "hsl(" + hue + ",58%," + light + "%)";
      g.beginPath();
      for (k = 0; k < c.count; k++) {
        var px = sx + (LX[k] * c.cr - LY[k] * c.sr) * scale;
        var py = sy + (LX[k] * c.sr + LY[k] * c.cr) * scale;
        g.moveTo(px + rad, py);
        g.arc(px, py, rad, 0, 2 * Math.PI);
      }
      g.fill();
    }

    // highlight the latest event
    var ev = lastEvent;
    if (ev.type !== "start") {
      var alpha = Math.max(0, 1 - (now - ev.t) / 2500);
      if (alpha > 0) {
        var city = cities[ev.city];
        var np = personPos(city, ev.idx);
        var nx = cx + np.x * scale, ny = cy + np.y * scale;
        g.globalAlpha = alpha;
        if (ev.type === "join") {
          var pp = personPos(city, ev.pickedIdx);
          var qx = cx + pp.x * scale, qy = cy + pp.y * scale;
          g.strokeStyle = fg; g.lineWidth = 1.5;
          g.beginPath(); g.moveTo(qx, qy); g.lineTo(nx, ny); g.stroke();
          g.beginPath(); g.arc(qx, qy, rad + 3, 0, 2 * Math.PI); g.stroke();
        }
        g.strokeStyle = accent; g.lineWidth = 2.5;
        g.beginPath(); g.arc(nx, ny, rad + 3 + (ev.type === "new" ? 3 : 0), 0, 2 * Math.PI); g.stroke();
        g.globalAlpha = 1;
      }
    }
  }

  function updateText() {
    var p = getP();
    $("pVal").textContent = p.toFixed(2);
    $("speedVal").textContent = getSpeed() + "/s";

    var ev = lastEvent, html;
    if (ev.type === "start") {
      html = "<b>Gyventojas #1</b> įkūrė <b>Miestas #1</b>. Taip prasideda visi modeliavimai. Toliau spauskite mygtuką \"Paleisti\" arba mygtukus \"+X\".";
    } else if (ev.type === "new") {
      html = "<b>Naujas gyventojas #" + ev.person.toString() + "</b> pasirinko įkurti naują miestą, <b>Miestą #" + (ev.city + 1) + "</b>.";
    } else {
        html = "<b>Naujas gyvetojas #" + ev.person.toString() + "</b> pasirinko gyventoją #" + ev.picked.toString() + " ir prisijungė prie jo miesto. <b>Miestas #" + (ev.city + 1) + "</b> gyvena <b>" + ev.size.toLocaleString() + "</b> gyventojų.";
    }
    $("event").innerHTML = html;

    $("stats").innerHTML =
      "<div><span>gyventojų </span><b>" + n.toLocaleString() + "</b></div>" +
      "<div><span>miestų </span><b>" + cities.length.toLocaleString() + "</b></div>" +
      "<div><span>didžiausias miestas </span><b>" + maxSize.toLocaleString() + "</b> (" + (100 * maxSize / n).toFixed(1) + "% nuo visų gyventojų)</div>" +
      "<div><span>vidutinis miesto dydis </span><b>" + (n / cities.length).toFixed(1) + "</b></div>" +
      (n >= MAX_N ? "<div><b>Daugiau gyventojų pridėti negalima. Spauskite mygtuką \"Iš naujo\".</b></div>" : "");

    if (hoverCity >= 0 && hoverCity < cities.length) {
      var hc = cities[hoverCity];
      $("hover").textContent = "Miestas #" + (hc.id + 1) + ": " + hc.count.toLocaleString() + " gyventojų (" +
        (100 * hc.count / n).toFixed(1) + "% visų gyventojų)";
    } else {
      $("hover").textContent = "Užveskite pelę ant miesto, kad pamatytumėte miesto informaciją.";
    }
  }

  /* ---------- controls ---------- */

  function setRunning(v) {
    running = v;
    $("play").textContent = v ? "Stabdyti" : "Paleisti";
  }

  $("play").onclick = function () { setRunning(!running); };
  $("step").onclick = function () { setRunning(false); advance(1); };
  $("step10").onclick = function () { advance(10); };
  $("step100").onclick = function () { advance(100); };
  $("reset").onclick = function () { reset(); };

  canvas.addEventListener("mousemove", function (e) {
    var r = canvas.getBoundingClientRect();
    var wx = (e.clientX - r.left - geom.cx) / geom.scale;
    var wy = (e.clientY - r.top - geom.cy) / geom.scale;
    var best = -1, bestD = Infinity;
    for (var i = 0; i < cities.length; i++) {
      var c = cities[i], dx = wx - c.x, dy = wy - c.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d <= c.Rd + 0.5 && d < bestD) { best = i; bestD = d; }
    }
    hoverCity = best;
  });
  canvas.addEventListener("mouseleave", function () { hoverCity = -1; });

  function frame(t) {
    var dt = Math.min(0.1, (t - lastT) / 1000);
    lastT = t;
    if (running) {
      not_running = 0;
      acc += getSpeed() * dt;
      var k = Math.floor(acc);
      acc -= k;
      if (k > 0) advance(k);
    }
    if (running || (!running && not_running < MAX_NOT_RUNNING)) {
      if(!running) {
        not_running += 1;
      }
      physics();
    }
    draw(performance.now());
    updateText();
    requestAnimationFrame(frame);
  }

  reset();
  // let the initial layout settle before the first frame is shown
  for (var warm = 0; warm < 60; warm++) physics();
  requestAnimationFrame(function (t) { lastT = t; frame(t); });
})();
</script>
</body>
</html>
