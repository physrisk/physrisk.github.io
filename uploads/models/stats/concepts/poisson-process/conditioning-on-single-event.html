<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Conditioning on a single event per window problem</title>
    <link rel="stylesheet" type="text/css" href="../../../shared-libs/normalize.css">
    <link rel="stylesheet" type="text/css" href="../../../shared-libs/universal-style.css">
    <script src="../../../shared-libs/plotly-131.min.js"></script>
    <script src="../../../shared-libs/plotlyPlot.js"></script>
    <script src="../../../shared-libs/random-026.min.js"></script>
</head>
<body>
<div id="wrapper">
    <div id="figureWrapper">
        <div id="plotLabel" class="label"><span id="rejected_events">0%</span> samples rejected</div>
        <div id="pdfPlot" class="fullSize"></div>
    </div><!-- #figureWrapper -->
    <div id="controlWrapper">
        <span class="controlBlock">
            <label for="event_rate">&lambda; = </label>
            <input id="event_rate" type="number" min="0.2" max="5" step="0.1" value="1">
        </span>
        <span class="controlBlock">
            <label for="observation_period">T = </label>
            <input id="observation_period" type="number" value="1" disabled=disabled>
        </span>
        <br>
        <span class="controlBlock">
            <button name="start" id="start">Start</button>
        </span>
        <span class="controlBlock">
            <button name="resume" id="resume">Resume</button>
        </span>
    </div><!-- #controlWrapper -->
</div><!-- #wrapper -->
<script src="./conditioning-on-single-event.js"></script>
</body>
</html>
