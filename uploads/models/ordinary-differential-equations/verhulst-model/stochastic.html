<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Various trajectories of Verhulst model with periodic capacity</title>
    <link rel="stylesheet" type="text/css" href="../../shared-libs/normalize.css">
    <link rel="stylesheet" type="text/css" href="../../shared-libs/universal-style.css">
    <script src="../../shared-libs/plotly-131.min.js"></script>
    <script src="../../shared-libs/plotlyPlot.js"></script>
    <script src="../../shared-libs/random-026.min.js"></script>
</head>
<body>
<div id="wrapper">
    <div id="figureWrapper">
        <div id="mainPlot" class="fullSize"></div>
    </div><!-- #figureWrapper -->
    <div id="controlWrapper">
        <span class="controlBlock">
            <label for="mu">&mu; = </label>
            <input id="mu" type="number" min="0.01" max="1" step="0.01" value="0.1">
        </span>
        <span class="controlBlock">
            <label for="sigma">&sigma; = </label>
            <input id="sigma" type="number" min="0.1" max="20" step="0.1" value="5">
        </span>
        <span class="controlBlock">
            <label for="P_0">P<sub>0</sub> = </label>
            <input id="P_0" type="number" min="1" max="1000" step="1" value="250">
        </span>
        <span class="controlBlock">
            <label for="K">K = </label>
            <input id="K" type="number" value="1000" disabled="disabled">
        </span>
        <br>
        <span class="controlBlock"><button id="regenerate">Regenerate noise</button></span>
    </div><!-- #controlWrapper -->
</div><!-- #wrapper -->
<script src="./stochastic.js"></script>
</body>
</html>
