<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Various trajectories of Verhulst model with periodic capacity</title>
    <link rel="stylesheet" type="text/css" href="../../shared-libs/normalize.css">
    <link rel="stylesheet" type="text/css" href="../../shared-libs/universal-style.css">
    <script src="../../shared-libs/plotly-131.min.js"></script>
    <script src="../../shared-libs/plotlyPlot.js"></script>
</head>
<body>
<div id="wrapper">
    <div id="figureWrapper">
        <div id="mainPlot" class="fullSize"></div>
    </div><!-- #figureWrapper -->
    <div id="controlWrapper">
        <span class="controlBlock">
            <label for="alpha">&alpha; = </label>
            <input id="alpha" type="number" min="0.01" max="1" step="0.01" value="0.1">
        </span>
        <span class="controlBlock">
            <label for="K_min">K<sub>min</sub> = </label>
            <input id="K_min" type="number" min="1" max="500" step="1" value="200">
        </span>
        <span class="controlBlock">
            <label for="K_max">K<sub>max</sub> = </label>
            <input id="K_max" type="number" min="1" max="500" step="1" value="300">
        </span>
        <span class="controlBlock">
            <label for="K_period">T<sub>K</sub> = </label>
            <input id="K_period" type="number" min="10" max="200" step="1" value="25">
        </span>
    </div><!-- #controlWrapper -->
</div><!-- #wrapper -->
<script src="./periodic.js"></script>
</body>
</html>
